  --orange:#e8903a; --red:#d95f4b; --denim:#5b85b8; --brown:#6b4226; --cream:#fef3e2;

  --body:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  color-scheme:light;

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);color:var(--text);background:var(--bg);

.tag.since{background:#fff8e8;border:2px dashed var(--orange);color:var(--orange);transform:rotate(-2deg)}
.h-sub{font-family:var(--display);color:var(--orange);font-size:1.1rem}
h1{font-family:var(--display);font-size:clamp(2.4rem,10vw,3.4rem);line-height:1.08;text-wrap:balance;letter-spacing:.04em;
  background:linear-gradient(135deg,var(--brown) 0%,var(--orange) 55%,var(--denim) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.uline{height:4px;width:190px;border-radius:999px;margin-top:6px;background:linear-gradient(90deg,var(--red),var(--orange),var(--denim))}

/* 統計 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:14px 10px;text-align:center;box-shadow:0 2px 12px rgba(100,70,40,.06)}
.stat .n{font-family:var(--display);font-size:clamp(1.5rem,6vw,2rem);color:var(--orange);line-height:1;font-variant-numeric:tabular-nums}
.stat .l{font-size:11.5px;font-weight:700;color:var(--sub);margin-top:6px;letter-spacing:.04em}
.stat.main .n{color:var(--red)}

/* Twitch */
.twitch-btn{display:flex;align-items:center;gap:12px;padding:10px 18px 10px 11px;border-radius:999px;
  background:linear-gradient(135deg,#9147ff,#772ce8);color:#fff;text-decoration:none;
  box-shadow:0 6px 20px rgba(145,71,255,.32);transition:transform .2s cubic-bezier(.34,1.56,.64,1)}
.twitch-btn:hover{transform:translateY(-2px)}
.twitch-btn:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
.tw-ico{width:34px;height:34px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tw-ico svg{width:18px;height:18px;fill:#9147ff}
.tw-txt{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.tw-txt b{font-size:14px;font-weight:900;letter-spacing:.06em}
.tw-txt small{font-size:11px;opacity:.8}

/* 篩選 */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{border:1.5px solid var(--border);background:var(--card);color:var(--sub);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px}
.fbtn .c{font-size:11px;opacity:.7;font-variant-numeric:tabular-nums}
.fbtn:hover{border-color:var(--orange);color:var(--text)}
.fbtn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.fbtn.on{background:var(--text);border-color:var(--text);color:#fff}

/* 時間軸 */
.timeline{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:30px}
.timeline::before{content:'';position:absolute;left:9px;top:8px;bottom:8px;width:3px;border-radius:3px;background:linear-gradient(var(--line),var(--line)) }
.year{position:relative;font-family:var(--display);font-size:1.7rem;color:var(--brown);margin:10px 0 2px;line-height:1;display:flex;align-items:baseline;gap:10px}
.year::before{content:'';position:absolute;left:-30px;top:50%;width:21px;height:21px;margin-top:-11px;border-radius:50%;background:var(--brown);box-shadow:0 0 0 5px var(--bg)}
.year small{font-family:var(--body);font-size:12px;font-weight:700;color:var(--sub)}

.ev{position:relative;background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:14px 16px;box-shadow:0 2px 12px rgba(100,70,40,.06);
  animation:popIn .45s cubic-bezier(.34,1.56,.64,1) both;--c:var(--t-mile);--cl:var(--t-mile-l)}
.ev::before{content:'';position:absolute;left:-26px;top:20px;width:13px;height:13px;border-radius:50%;background:var(--card);border:3px solid var(--c);box-shadow:0 0 0 4px var(--bg)}
.ev[data-tag="stat"]{--c:var(--t-stat);--cl:var(--t-stat-l)}
.ev[data-tag="meet"]{--c:var(--t-meet);--cl:var(--t-meet-l)}
.ev[data-tag="event"]{--c:var(--t-event);--cl:var(--t-event-l)}
.ev[data-tag="live"]{--c:var(--t-live);--cl:var(--t-live-l)}
.ev-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ev-date{font-family:var(--display);font-size:1.15rem;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
.ev-dow{font-size:11px;font-weight:700;color:var(--sub)}
.pill{font-size:11px;font-weight:900;border-radius:999px;padding:3px 9px;background:var(--cl);color:var(--c);letter-spacing:.03em}
.day{margin-left:auto;font-size:11px;font-weight:700;color:var(--sub);background:#f6efe7;border-radius:8px;padding:2px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev h3{font-size:16px;font-weight:900;line-height:1.45;text-wrap:balance}
.ev p{font-size:13.5px;color:#6e5a46;line-height:1.75;margin-top:4px}
.ev figure{margin-top:10px;border-radius:14px;overflow:hidden;border:1.5px solid var(--border);background:#f3ece4}
.ev figure img{display:block;width:100%;max-height:360px;object-fit:cover}
.ev figcaption{font-size:11.5px;color:var(--sub);padding:6px 10px}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.links a{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--c);background:var(--cl);border-radius:999px;padding:5px 12px;text-decoration:none}
.links a:hover{filter:brightness(.95)}
.links a:focus-visible{outline:2px solid var(--c);outline-offset:2px}

/* 數據里程碑卡 */
.ev.is-stat{background:linear-gradient(135deg,#fff3ee 0%,#fff 60%);border-color:#f4c7bc}
.big{display:flex;align-items:baseline;gap:8px;margin:4px 0 2px}
.big .num{font-family:var(--display);font-size:clamp(2.4rem,11vw,3.2rem);line-height:1;color:var(--c);font-variant-numeric:tabular-nums;
  background:linear-gradient(135deg,var(--red),var(--orange));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.big .unit{font-size:14px;font-weight:900;color:var(--sub)}

/* 週年（自動產生） */
.ev.anniv{background:linear-gradient(135deg,var(--cream),#fff 70%);border-style:dashed;border-color:#efc58f}
.ev.anniv h3::before{content:'🎂 '}

/* 即將到來 */
.ev.future{border-style:dashed;background:repeating-linear-gradient(135deg,#fff,#fff 10px,#fffaf3 10px,#fffaf3 20px)}
.ev.future::before{background:var(--c);animation:pulse 1.6s infinite}
.soon{font-size:11px;font-weight:900;color:#fff;background:var(--c);border-radius:999px;padding:3px 9px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px var(--bg),0 0 0 6px transparent}50%{box-shadow:0 0 0 4px var(--bg),0 0 0 9px var(--cl)}}

.empty{text-align:center;color:var(--sub);font-size:13px;padding:20px}
.foot{text-align:center;font-size:11.5px;color:var(--sub);line-height:1.8}

#updateToast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-180%);z-index:100;display:flex;align-items:center;gap:10px;
  background:linear-gradient(135deg,var(--red),var(--orange));color:#fff;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-size:13px;font-weight:900;cursor:pointer;
  box-shadow:0 6px 24px rgba(217,95,75,.4);transition:transform .45s cubic-bezier(.34,1.56,.64,1);white-space:nowrap}
#updateToast.show{transform:translate(-50%,0)}

@keyframes popIn{from{opacity:.001;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.day{margin-left:0}.stats{gap:8px}}
</style>
</head>
<body>

<button id="updateToast" type="button" onclick="location.reload()">🔄 大事記更新了！點我重新整理</button>

<div class="wrap">
  <header>
    <div class="photo" role="img" aria-label="原原"></div>
    <div class="hero-txt">
      <div class="tags">
        <span class="tag live">● STREAMER</span>
        <span class="tag since" id="sinceTag">since 2024.11.29</span>
      </div>
      <div class="h-sub">原原の</div>
      <h1>大事記</h1>
      <div class="uline"></div>
    </div>
  </header>

  <section class="stats" aria-label="統計">
    <div class="stat main"><div class="n" id="sDays">—</div><div class="l">開台第幾天</div></div>
    <div class="stat"><div class="n" id="sMeet">—</div><div class="l">台聚次數</div></div>
    <div class="stat"><div class="n" id="sEvents">—</div><div class="l">大事件</div></div>
  </section>

  <a class="twitch-btn" href="https://www.twitch.tv/your_yuanyuan" target="_blank" rel="noopener">
    <span class="tw-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg></span>
    <span class="tw-txt"><b>前往直播間</b><small>twitch.tv/your_yuanyuan</small></span>
    <span aria-hidden="true">▶</span>
  </a>

  <nav class="filters" id="filters" aria-label="分類篩選"></nav>

  <section class="timeline" id="timeline" aria-live="polite"></section>

  <p class="foot">紀錄持續更新中 ✦ 有漏掉的大事歡迎告訴我們 🌸</p>
</div>

<script>
/* ══════════════════════════════════════════════════════
   大事記資料：新增事件只要在這裡加一筆
   date   必填  'YYYY-MM-DD'；只知道月份就寫 'YYYY-MM'
   tag    必填  mile 里程碑 / stat 數據 / meet 台聚 / event 活動 / live 直播
   title  必填  標題
   desc   選填  說明
   img    選填  圖片路徑，例 'images/meetup1.jpg'（放在同一個 repo）
   cap    選填  圖片說明
   links  選填  [{ label:'精華', url:'https://...' }]
   num    選填  數據里程碑的大數字，例 '1,000'；unit 單位，例 '追隨者'
   ══════════════════════════════════════════════════════ */
const FIRST_STREAM = '2024-11-29';
const EVENTS = [
  { date:'2024-11-29', tag:'mile',  title:'第一次開台', desc:'原原在 Twitch 的第一場直播，一切從這天開始。' },
  { date:'2025-03-12', tag:'live',  title:'生日抽獎直播', links:[{ label:'生日抽獎影片', url:'https://www.youtube.com/watch?v=YhtMiarhYTA' }] },
  { date:'2025-08-04', tag:'stat',  title:'追隨者突破 10,000 人', num:'10,000', unit:'追隨者' },
  { date:'2025-12-21', tag:'meet',  title:'第一次台聚' },
  { date:'2026-01-30', tag:'event', title:'第一次參加電玩展' },
  { date:'2026-05-09', tag:'meet',  title:'第二次台聚' },
  { date:'2026-05-20', tag:'live',  title:'520 抽獎直播' },
  { date:'2026-05-28', tag:'stat',  title:'追隨者突破 20,000 人', num:'20,000', unit:'追隨者' },
  { date:'2026-07-27', tag:'event', title:'第一次拍跳舞 MV', links:[{ label:'跳舞 MV', url:'https://www.youtube.com/watch?v=h8hfEovQW-Y' }] },
  { date:'2026-10',    tag:'live',  title:'開始每週固定開台', desc:'週一下午、週三晚上 21:00、週五下午、週六晚上。' },
  { date:'2026-11-08', tag:'meet',  title:'第三次台聚', desc:'VIP 台聚，VIP 或層級三訂閱可以報名。' },
  { date:'2026-11-28', tag:'event', title:'第一次線下工商當關主' },
];
const AUTO_ANNIVERSARY = true;   // 自動加上開台週年
const ANNIV_LINKS = {            // 週年的影片連結：第幾週年: [{label, url}]
  1: [{ label:'一週年影片', url:'https://www.youtube.com/watch?v=OIu9JBOHkII' }],
  2: [{ label:'二週年預告', url:'https://www.youtube.com/watch?v=d8jr129UrK4' }],
};
/* ══════════════════════════════════════════════════════ */

const TAGS = { mile:'里程碑', stat:'數據', meet:'台聚', event:'活動', live:'直播' };
const DOW = ['日','一','二','三','四','五','六'];
const DAY = 86400000;
const $ = id => document.getElementById(id);

function todayTW(){ const s=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(new Date()); return toUTC(s); }
function toUTC(s){ const [y,m,d]=s.split('-').map(Number); return Date.UTC(y,(m||1)-1,d||1); }
const first = toUTC(FIRST_STREAM), today = todayTW();
const dayN = t => Math.round((t-first)/DAY)+1;

// 組資料
let list = EVENTS.map(e => ({ ...e, t: toUTC(e.date), monthOnly: e.date.length===7 }));
if (AUTO_ANNIVERSARY){
  const fy = new Date(first).getUTCFullYear();
  for (let k=1; ; k++){
    const t = Date.UTC(fy+k, new Date(first).getUTCMonth(), new Date(first).getUTCDate());
    const cn = ['','一','兩','三','四','五','六','七','八','九','十'][k] || k;
    list.push({ date:'', t, tag:'mile', title:`開台${cn}週年`, anniv:true, links:ANNIV_LINKS[k] });
    if (t > today) break;   // 只加到下一個即將到來的週年
  }
}
list.sort((a,b)=>a.t-b.t);

// 統計
$('sDays').textContent = dayN(today).toLocaleString();
$('sMeet').textContent = list.filter(e=>e.tag==='meet' && e.t<=today).length;
$('sEvents').textContent = list.filter(e=>!e.anniv && e.t<=today).length;
$('sinceTag').textContent = 'since ' + FIRST_STREAM.replaceAll('-','.');

// 篩選
let cur = 'all';
try { cur = localStorage.getItem('chron-filter') || 'all'; } catch {}
function renderFilters(){
  const f = $('filters'); f.innerHTML = '';
  const opts = [['all','全部', list.length], ...Object.entries(TAGS).map(([k,v])=>[k,v,list.filter(e=>e.tag===k).length]).filter(o=>o[2])];
  if (!opts.some(o=>o[0]===cur)) cur='all';
  opts.forEach(([k,label,n])=>{
    const b=document.createElement('button'); b.type='button'; b.className='fbtn'+(k===cur?' on':'');
    b.setAttribute('aria-pressed', k===cur);
    b.innerHTML = `${label}<span class="c">${n}</span>`;
    b.onclick=()=>{ cur=k; try{localStorage.setItem('chron-filter',k)}catch{}; renderFilters(); renderTimeline(); };
    f.appendChild(b);
  });
}

const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderTimeline(){
  const tl = $('timeline'); tl.innerHTML='';
  const items = list.filter(e=>cur==='all'||e.tag===cur);
  if (!items.length){ tl.innerHTML='<div class="empty">這個分類還沒有紀錄</div>'; return; }
  let year=null, i=0;
  items.forEach(e=>{
    const d = new Date(e.t), y=d.getUTCFullYear();
    if (y!==year){
      year=y;
      const yc = items.filter(x=>new Date(x.t).getUTCFullYear()===y).length;
      const h=document.createElement('div'); h.className='year'; h.innerHTML=`${y}<small>${yc} 件</small>`; tl.appendChild(h);
    }
    const future = e.t > today;
    const md = e.monthOnly ? `${d.getUTCMonth()+1} 月` : `${d.getUTCMonth()+1}/${d.getUTCDate()}`;
    const dow = e.monthOnly ? '' : `（${DOW[d.getUTCDay()]}）`;
    const dayTxt = future ? '' : e.monthOnly ? '' : `開台第 ${dayN(e.t).toLocaleString()} 天`;
    const soon = future ? `<span class="soon">還有 ${Math.round((e.t-today)/DAY)} 天</span>` : '';
    const el=document.createElement('article');
    el.className='ev'+(e.num?' is-stat':'')+(e.anniv?' anniv':'')+(future?' future':'');
    el.dataset.tag=e.tag; el.style.animationDelay=(i++*0.04)+'s';
    el.innerHTML = `
      <div class="ev-top"><span class="ev-date">${md}</span><span class="ev-dow">${dow}</span>
        <span class="pill">${TAGS[e.tag]||''}</span>${soon}${dayTxt?`<span class="day">${dayTxt}</span>`:''}</div>
      ${e.num?`<div class="big"><span class="num">${esc(e.num)}</span><span class="unit">${esc(e.unit||'')}</span></div>`:''}
      <h3>${esc(e.title)}</h3>
      ${e.desc?`<p>${esc(e.desc)}</p>`:''}
      ${e.img?`<figure><img src="${esc(e.img)}" alt="${esc(e.cap||e.title)}" loading="lazy">${e.cap?`<figcaption>${esc(e.cap)}</figcaption>`:''}</figure>`:''}
      ${e.links&&e.links.length?`<div class="links">${e.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">▶ ${esc(l.label||'精華')}</a>`).join('')}</div>`:''}`;
    tl.appendChild(el);
  });
}
renderFilters(); renderTimeline();

// Twitch：在 GitHub Pages 的手機上優先開 App，沒裝就開網頁
(function(){
  if (!/github\.io$/.test(location.hostname)) return;
  const isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(!isMobile) return;
  document.querySelectorAll('.twitch-btn').forEach(a=>a.addEventListener('click',e=>{
    e.preventDefault(); let left=false; const onHide=()=>{left=true};
    document.addEventListener('visibilitychange',onHide,{once:true}); window.addEventListener('pagehide',onHide,{once:true});
    location.href='twitch://stream/your_yuanyuan';
    setTimeout(()=>{ if(!left&&!document.hidden) location.href='https://www.twitch.tv/your_yuanyuan'; },1500);
  }));
})();

// GitHub Pages 更新偵測
(function(){
  if (!/github\.io$/.test(location.hostname)) return;
  let base=null, shown=false; const url=location.href.split('#')[0].split('?')[0];
  async function check(){
    if(shown) return;
    try{ const r=await fetch(url+'?_v='+Date.now(),{method:'HEAD',cache:'no-store'}); if(!r.ok) return;
      const v=r.headers.get('etag')||r.headers.get('last-modified')||r.headers.get('content-length'); if(!v) return;
      if(base===null){ base=v; return; } if(v!==base){ shown=true; $('updateToast').classList.add('show'); }
    }catch{}
  }
  check(); setInterval(check,60000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) check(); });
})();
</script>

</body>
</html>
