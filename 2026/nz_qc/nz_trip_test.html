// ── Helpers ────────────────────────────────────────────────────────────────────
let html = null
async function getHTML() {
  if (html) return html
  const r = await fetch(SITE, { cache: 'no-store' })   // 不吃瀏覽器快取，確保抓到最新部署
  html = await r.text()
  return html
}
// Apps Script 出錯時會回 HTML 錯誤頁 → 把標題和開頭內容顯示出來，方便判斷原因
async function parseSheets(r) {
  const text = await r.text()
  try { return JSON.parse(text) } catch {
    const title = (text.match(/<title>([^<]*)<\/title>/i) || [])[1] || ''
    const body = text.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 160)
    throw new Error(`Apps Script 回傳 HTML（HTTP ${r.status}）${title ? `「${title}」` : ''}：${body}`)
  }
}
const api = {
  get: () => fetch(SHEETS).then(parseSheets),
  post: d => fetch(SHEETS, {method:'POST', body:JSON.stringify(d)}).then(parseSheets),
}

// POST with timeout — 避免 hang 住卡死後續測試
async function postTimeout(data, ms=12000) {
  const ctrl = new AbortController()
  const timer = setTimeout(() => ctrl.abort(), ms)
  try {
    const r = await fetch(SHEETS, {
      method: 'POST',
      body: JSON.stringify(data),
      signal: ctrl.signal,
    })
    return await r.json()
  } catch(e) {
    return { success: false, error: e.name==='AbortError' ? `timeout (${ms}ms)` : e.message }
  } finally {
    clearTimeout(timer)
  }
}
const tids = []
function tid(p='t') { const id=`${p}-${Date.now()}-${Math.random().toString(36).slice(2,5)}`; tids.push(id); return id }
function assert(c, m) { if (!c) throw new Error(m) }
const sleep = ms => new Promise(r=>setTimeout(r,ms))

function isWithin16Days(dateStr) {
  const target = new Date(dateStr + 'T12:00:00+13:00')
  const now    = new Date()
  const diff   = (target - now) / (1000 * 60 * 60 * 24)
  return diff >= 0 && diff <= 16
}

const OUTFIT_LAYERS = ['base', 'mid', 'insulation', 'shell']
// 洋蔥層數條：穿上 wear / 帶著備用 carry / 不需要 none
function mockLayerBar(o) {
  return OUTFIT_LAYERS.map(k => o.layers[k] ? 'wear' : (o.carry || []).includes(k) ? 'carry' : 'none')
}
// 一天兩段：NZ 時間 18:00 之後切到晚上那套
function mockPickSession(o, hhmm) {
  return o.night && hhmm >= o.night.from ? { ...o, ...o.night } : o
}
// 天氣連動：依使用者的 4 級規則微調
function mockWeatherAdvice(o, w) {
  const tips = []
  if (w.tmin != null && w.tmin < 5 && !o.layers.insulation) tips.push(`🥶 預報最低 ${Math.round(w.tmin)}°C，輕羽絨直接穿上`)
  if (((w.precip ?? 0) >= 5 || (w.snow ?? 0) > 0) && !o.layers.shell) tips.push('🌧️ 預報有雨雪，穿上防風防水外套')
  else if ((w.wind ?? 0) > 40 && !o.layers.shell) tips.push(`🌬️ 預報強風 ${Math.round(w.wind)}km/h，加上防風外套`)
  if (w.tmax != null && w.tmax >= 20) tips.push(`☀️ 白天最高 ${Math.round(w.tmax)}°C，熱了可以脫到短袖`)
  return tips
}
// 紫外線：WHO 分級（四捨五入後）0–2 低 / 3–5 中 / 6–7 高 / 8–10 很高 / 11+ 極高；SunSmart NZ：3 以上要防曬
const UV_LEVELS = ['low', 'moderate', 'high', 'veryHigh', 'extreme']
function mockUvLevel(uv) {
  const u = Math.round(uv)
  return u >= 11 ? 'extreme' : u >= 8 ? 'veryHigh' : u >= 6 ? 'high' : u >= 3 ? 'moderate' : 'low'
}
// 雪地 / 冰川日：反射＋海拔 → 往上加一級（最高到 extreme）
function mockSunLevel(uv, snow) {
  const i = UV_LEVELS.indexOf(mockUvLevel(uv))
  return UV_LEVELS[Math.min(i + (snow ? 1 : 0), UV_LEVELS.length - 1)]
}
// 防曬時段：當天每小時 UV ≥ 3 的第一個小時 ～ 最後一個小時 +1h；沒有就 null
function mockSunWindow(hourly, date) {
  const hrs = hourly.filter(h => h.time.startsWith(date) && h.uv >= 3).map(h => Number(h.time.slice(11, 13)))
  if (!hrs.length) return null
  const pad = n => String(n).padStart(2, '0')
  return `${pad(Math.min(...hrs))}:00–${pad(Math.max(...hrs) + 1)}:00`
}
// 電話自動變成可按：+國碼 或 0800 開頭；+64 後面多寫的 0 撥號時要拿掉
const PHONE_RE = /(\+\d{1,3}(?:[ -]?\d){7,12}|\b0800(?:[ -]?\d){6})/g
function mockTelHref(num) {
  let d = num.replace(/[^\d+]/g, '')
  if (d.startsWith('+640')) d = '+64' + d.slice(4)
  return 'tel:' + d
}

const KP_URL = 'https://services.swpc.noaa.gov/products/noaa-planetary-k-index-forecast.json'
function mockParseKp(json) {
  let rows = json
  if (Array.isArray(json[0])) { const h = json[0].map(x => String(x).toLowerCase()); rows = json.slice(1).map(r => Object.fromEntries(h.map((k, i) => [k, r[i]]))) }
  return rows.map(r => { const iso = String(r.time_tag).replace(' ', 'T'); return { t: Date.parse(/Z|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + 'Z'), kp: Number(r.kp) } })
    .filter(r => Number.isFinite(r.t) && Number.isFinite(r.kp))
}
// 今晚 = NZ 20:00 ～ 隔天 03:00；10 月是夏令時間 UTC+13 → UTC 當天 07:00 ～ 14:00；3 小時區段有重疊就算
function mockTonightKp(list, date) {
  const s = Date.parse(date + 'T07:00:00Z'), e = Date.parse(date + 'T14:00:00Z')
  const hit = list.filter(x => x.t + 3 * 3600e3 > s && x.t < e)
  return hit.length ? Math.max(...hit.map(x => x.kp)) : null
}
function mockTonightCloud(hourly, date, next) {
  const v = hourly.filter(h => { const hh = +h.time.slice(11, 13); return (h.time.startsWith(date) && hh >= 20) || (h.time.startsWith(next) && hh < 3) }).map(h => h.cloud)
  return v.length ? Math.round(v.reduce((a, b) => a + b, 0) / v.length) : null
}
function mockAuroraLevel(kp, cloud) {
  const base = kp >= 7 ? 'high' : kp >= 5 ? 'chance' : 'low'
  return base !== 'low' && cloud != null && cloud >= 70 ? 'cloudy' : base
}
const KP_SAMPLE = [['time_tag', 'kp', 'observed', 'noaa_scale'],
  ['2026-10-11 03:00:00', '6.00', 'predicted', 'G2'],  // NZ 16:00–19:00，不算今晚
  ['2026-10-11 06:00:00', '3.33', 'predicted', null],  // NZ 19:00–22:00，有重疊
  ['2026-10-11 09:00:00', '5.33', 'predicted', 'G1'],
  ['2026-10-11 12:00:00', '4.00', 'predicted', null],
  ['2026-10-11 15:00:00', '8.00', 'predicted', 'G4']]  // NZ 04:00 之後，不算

// ── Runner ────────────────────────────────────────────────────────────────────
let pass=0, fail=0, total=0

function upd() {
  document.getElementById('sp').textContent = pass
  document.getElementById('sf').textContent = fail
  document.getElementById('st').textContent = total
  document.getElementById('pb').style.width = (total?(pass/total*100):0)+'%'
  document.getElementById('summary').style.background = fail>0 ? '#8a2020' : '#173d2a'
}

function render() {
  const tc = document.getElementById('tc')
  tc.innerHTML = ''
  GROUPS.forEach(g => {
    tc.innerHTML += `
    <div class="grp" id="g-${g.id}">
      <div class="grp-h" onclick="tog('${g.id}')">
        <span class="grp-t">${g.title}</span>
        <span class="badge b-wait" id="bd-${g.id}">待機</span>
      </div>
      <div class="tests" id="ts-${g.id}">
        ${g.tests.map((t,i)=>`
          <div class="test">
            <div class="ico" id="ic-${g.id}-${i}">○</div>
            <div style="flex:1">
              <div class="tname">${t.name}</div>
              <div class="tdet" id="dt-${g.id}-${i}"></div>
            </div>
          </div>`).join('')}
        ${g.id==='console'?`<pre class="console-box" id="console-code">${CONSOLE_SCRIPT}</pre>`:''}
      </div>
    </div>`
  })
}

function tog(id) {
  const el = document.getElementById(`ts-${id}`)
  el.style.display = el.style.display==='none' ? '' : 'none'
}

async function runG(gid) {
  const g = GROUPS.find(x=>x.id===gid)
  if (!g) return
  document.getElementById(`bd-${gid}`).className='badge b-run'
  document.getElementById(`bd-${gid}`).textContent='執行中'
  let gp=0, gf=0
  for (let i=0;i<g.tests.length;i++) {
    const ic=document.getElementById(`ic-${gid}-${i}`)
    const dt=document.getElementById(`dt-${gid}-${i}`)
    ic.textContent='…'; total++; upd()
    try {
      const msg = await g.tests[i].fn()
      ic.textContent='✓'; ic.style.color='#173d2a'
      dt.textContent = Array.isArray(msg)?msg.join('\n'):msg||''
      dt.className='tdet'; pass++; gp++
    } catch(e) {
      ic.textContent='✗'; ic.style.color='#c0392b'
      dt.textContent=e.message; dt.className='tdet err'; fail++; gf++
    }
    upd(); await sleep(80)
  }
  const bd=document.getElementById(`bd-${gid}`)
  bd.textContent=`${gp}/${gp+gf}`
  bd.className=`badge ${gf>0?'b-fail':'b-pass'}`
}

async function runAll() {
  pass=0; fail=0; total=0; html=null; tids.length=0; render(); upd()
  for (const g of GROUPS) await runG(g.id)
  await autoCleanup()
}

async function autoCleanup() {
  if (tids.length === 0) return
  const label = `自動清除 ${tids.length} 筆測試資料...`
  // Show cleanup status in summary area
  const bar = document.getElementById('pb')
  bar.style.background = '#8a8a8a'

  let ok=0, fail=0
  for (let i=0; i<tids.length; i++) {
    bar.style.width = ((i+1)/tids.length*100)+'%'
    try {
      const ctrl = new AbortController()
      const t = setTimeout(()=>ctrl.abort(), 10000)
      const r = await fetch(SHEETS, {
        method:'POST', body:JSON.stringify({action:'delete', id:tids[i]}), signal:ctrl.signal
      }).then(r=>r.json()).finally(()=>clearTimeout(t))
      if (r.success) ok++; else fail++
    } catch { fail++ }
    await sleep(120)
  }

  bar.style.width = '100%'
  bar.style.background = ok===tids.length ? '#173d2a' : '#c4952a'

  // Show cleanup result below summary
  const msg = document.createElement('div')
  msg.style.cssText = 'font-size:11px;color:#8a8a8a;text-align:center;margin-bottom:12px;font-family:monospace'
  msg.textContent = `🧹 自動清除：${ok} 筆已刪除${fail>0?' · '+fail+' 筆失敗（可用 cleanup.html 手動清）':''}`
  document.getElementById('pb').after(msg)
}

async function cleanupTests() {
  const d = await api.get()
  const items = (d.expenses||[]).filter(e=>tids.includes(e.id)||String(e.id).match(/^(t|add|nzd|rb|con|del|zh)-/))
  if (!items.length) { alert('沒有這次產生的測試資料'); return }
  for (const e of items) await api.post({action:'delete', id:e.id})
  alert(`已清除 ${items.length} 筆`)
}

render()
